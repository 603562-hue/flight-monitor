name: Flight Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install fast-flights==3.1.0 typing_extensions requests

      - name: Restore price history
        uses: actions/cache/restore@v5
        with:
          path: flight_state.json
          key: flight-monitor-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            flight-monitor-state-${{ github.ref_name }}-
            flight-monitor-state-

      - name: Run Flight Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python flight_monitor.py

      - name: Save price history
        uses: actions/cache/save@v5
        with:
          path: flight_state.json
          key: flight-monitor-state-${{ github.ref_name }}-${{ github.run_id }}
