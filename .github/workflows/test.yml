name: Get Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  get-chat-id:
    runs-on: ubuntu-latest
    steps:
      - name: Get Telegram Chat ID
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates" | python -c 'import sys,json; d=json.load(sys.stdin); print([u["message"]["chat"]["id"] for u in d["result"] if "message" in u])'
